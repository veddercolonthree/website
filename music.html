<!doctype html>
<html>
    <head>
        <title>music</title>
        <link rel="stylesheet" href="styles.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    </head>
    <body id="music">
        <h1 id="musicTitle" style="margin-bottom: 10px;"> music i enjoy </h1>
        <p id="musicTitle" style="margin-top: 10px;"> tap the record to play! </p>
        
        <div style="display: flex; justify-content: center;">
            <img id="albumCover">
            <div onclick="playing()" id="vinylContainer">
                <img id="vinylTemplate" src="images/albumCovers/fullVinylTemplate.png">
            </div>
        </div>

        <div id="songDisplay">
            <button style="float: left;" onclick="previousSong();"> < </button>
            <div id="songInfo">
                <p id="songTitle"> songName </p>
                <p id="songArtist"> artistName </p>
            </div>
            <button style="float: right;" onclick="nextSong();"> > </button>
        </div>

        <div style="justify-content: center; display: flex;">
            <img id="play" onclick="playPause()">
        </div>

        <br>
        <div class="okButton">
            <a href="index.html"> <p>< back</p> </a>
        </div>

        <script src="musicSwitcher/songControls.js"></script>
        <audio id="musicPlayer" autoplay></audio>
    </body>
</html>
